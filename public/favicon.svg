<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Speakeasy Gold Gradients -->
    <linearGradient id="goldGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF1B0"/>
      <stop offset="30%" stopColor="#F5CD47"/>
      <stop offset="65%" stopColor="#C9A227"/>
      <stop offset="100%" stopColor="#7E5F10"/>
    </linearGradient>

    <linearGradient id="goldGradSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8A6814"/>
      <stop offset="50%" stopColor="#E5BE38"/>
      <stop offset="100%" stopColor="#FFEAA0"/>
    </linearGradient>

    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFD700" stopOpacity="0.45"/>
      <stop offset="60%" stopColor="#C9A227" stopOpacity="0.15"/>
      <stop offset="100%" stopColor="#06060a" stopOpacity="0"/>
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Circular Medallion Background -->
  <circle cx="64" cy="64" r="62" fill="#07070d"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#goldGradPrimary)" stroke-width="1.5" opacity="0.85"/>
  <circle cx="64" cy="64" r="55.5" fill="none" stroke="#C9A227" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.45"/>

  <!-- Warm Core Amber Glow -->
  <circle cx="64" cy="54" r="36" fill="url(#amberGlow)"/>

  <!-- ── COCKTAIL GLASS BASE & STEM ── -->
  <!-- Flared Octagonal Base -->
  <path d="M42 108 L86 108 L80 102 L48 102 Z" fill="url(#goldGradPrimary)" filter="url(#subtleGlow)"/>
  <rect x="46" y="104" width="36" height="1.5" fill="#FFF1B0" opacity="0.8"/>

  <!-- Slender Dual Stem with Art-Deco Rings -->
  <rect x="61.5" y="78" width="5" height="24" rx="1.5" fill="url(#goldGradSecondary)"/>
  <ellipse cx="64" cy="94" rx="6.5" ry="2" fill="url(#goldGradPrimary)"/>
  <ellipse cx="64" cy="85" rx="5.5" ry="1.5" fill="url(#goldGradPrimary)"/>

  <!-- Glass Bowl Chevron / Coupe Silhouette -->
  <polygon points="64,80 34,58 94,58" fill="none" stroke="url(#goldGradPrimary)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Amber Liquid Pour Level inside glass -->
  <polygon points="64,76 44,61 84,61" fill="#C9A227" fill-opacity="0.25"/>

  <!-- ── BRAIN CEREBRUM & NEURAL LATTICE ── -->
  <!-- Left Hemisphere Convolutions -->
  <path d="M62 55 C52 55 42 52 35 45 C28 38 29 27 37 20 C42 15 50 15 55 19 C58 21 61 24 62 27 Z" 
        fill="none" stroke="url(#goldGradPrimary)" stroke-width="2.5" stroke-linecap="round"/>
  
  <path d="M37 32 C43 32 48 37 53 35 C58 33 60 28 62 27" 
        fill="none" stroke="url(#goldGradPrimary)" stroke-width="2" stroke-linecap="round"/>
  
  <path d="M42 42 C48 40 52 44 62 43" 
        fill="none" stroke="url(#goldGradPrimary)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right Hemisphere Convolutions -->
  <path d="M66 55 C76 55 86 52 93 45 C100 38 99 27 91 20 C86 15 78 15 73 19 C70 21 67 24 66 27 Z" 
        fill="none" stroke="url(#goldGradPrimary)" stroke-width="2.5" stroke-linecap="round"/>
  
  <path d="M91 32 C85 32 80 37 75 35 C70 33 68 28 66 27" 
        fill="none" stroke="url(#goldGradPrimary)" stroke-width="2" stroke-linecap="round"/>
  
  <path d="M86 42 C80 40 76 44 66 43" 
        fill="none" stroke="url(#goldGradPrimary)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Central Longitudinal Fissure / Ascending Insight Axis -->
  <line x1="64" y1="20" x2="64" y2="56" stroke="url(#goldGradPrimary)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ── GLOWING SYNAPSE NODES (NEURAL INTELLIGENCE) ── -->
  <circle cx="37" cy="20" r="2.8" fill="#FFF8D6" filter="url(#subtleGlow)"/>
  <circle cx="55" cy="19" r="2.5" fill="#FFF8D6" filter="url(#subtleGlow)"/>
  <circle cx="35" cy="45" r="2.5" fill="#FFF8D6" filter="url(#subtleGlow)"/>
  <circle cx="48" cy="35" r="2.8" fill="#FFF8D6" filter="url(#subtleGlow)"/>
  
  <circle cx="91" cy="20" r="2.8" fill="#FFF8D6" filter="url(#subtleGlow)"/>
  <circle cx="73" cy="19" r="2.5" fill="#FFF8D6" filter="url(#subtleGlow)"/>
  <circle cx="93" cy="45" r="2.5" fill="#FFF8D6" filter="url(#subtleGlow)"/>
  <circle cx="80" cy="35" r="2.8" fill="#FFF8D6" filter="url(#subtleGlow)"/>

  <!-- ── CELESTIAL DISTILLATION SPARK (TOP CREST) ── -->
  <g transform="translate(64, 13)">
    <!-- 4-point diamond star -->
    <path d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z" fill="url(#goldGradPrimary)" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>