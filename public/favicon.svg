<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Robust, guaranteed-render gradients with standard sRGB stops -->
    <linearGradient id="nbGoldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="75%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#9E7008" />
    </linearGradient>

    <linearGradient id="nbGoldHighlight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D4A017" />
      <stop offset="40%" stop-color="#FFE875" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="nbGoldShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C69214" />
      <stop offset="60%" stop-color="#8A6305" />
      <stop offset="100%" stop-color="#523900" />
    </linearGradient>

    <linearGradient id="nbBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#6B500C" />
    </linearGradient>
  </defs>

  <!-- ── NAVBAR BADGE CONTAINER (Rounded Black Medallion with Gold Inlay) ── -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#08080f" stroke="url(#nbBorderGrad)" stroke-width="2.5" />
  <!-- Subtle Inner Glow Ring -->
  <rect x="4" y="4" width="56" height="56" rx="11.5" fill="none" stroke="#FFD700" stroke-width="0.75" opacity="0.25" />

  <!-- ── CENTERED GOLD BRAIN EMBLEM (Scales to fill interior cleanly) ── -->
  <g transform="translate(1, 0)">
    <!-- 1. Frontal Superior Lobe (Top Left Dome) -->
    <path
      d="M22 10
         C28 9.5 35 11.5 40 15
         L35 20.5
         C30 18 24 17 18 19
         L17 15
         C18.5 13 20.2 11.3 22 10 Z"
      fill="url(#nbGoldHighlight)"
    />

    <!-- 2. Parietal Crown Lobe (Top Center/Right) -->
    <path
      d="M42 16.5
         C46.5 20 50.5 24 52 29.5
         L45 30.5
         C44 26.5 40.5 23.5 36.5 22
         Z"
      fill="url(#nbGoldBright)"
    />

    <!-- 3. Frontal Forehead Lobe (Far Left) -->
    <path
      d="M15.5 16.5
         L17 20
         C13 21.5 10 25 9.5 29
         L5 27.5
         C6 22 10 18 15.5 16.5 Z"
      fill="url(#nbGoldBright)"
    />

    <!-- 4. Central Sulcus / Mid-Brain Plate -->
    <path
      d="M18.5 22
         C24 20 31 21 35 24
         L36 28.5
         C31 26.5 24 26.5 19 29.5
         L17.5 25.5 Z"
      fill="url(#nbGoldHighlight)"
    />

    <!-- 5. Occipital Lobe (Upper Back of Brain) -->
    <path
      d="M45.5 32
         L53 31
         C53.5 35 52 38.5 48.5 41.5
         L43 38
         C44.5 36 45.5 34 45.5 32 Z"
      fill="url(#nbGoldShade)"
    />

    <!-- 6. Center Cortex Bridge (Thick Golden Ribbon) -->
    <path
      d="M20 31.5
         C26 29 34 29 41 32.5
         L39 37
         C33 34.5 26 35 21 38
         Z"
      fill="url(#nbGoldBright)"
    />

    <!-- 7. Temporal Lobe (Characteristic Inferior Front Notch) -->
    <path
      d="M11 31
         L18 32
         C19 35 17 38.5 13 40
         C10.5 37.5 9.5 34.5 11 31 Z"
      fill="url(#nbGoldShade)"
    />

    <!-- 8. Lower Temporal & Cerebellar Shelf -->
    <path
      d="M22 40
         C28 37 36 36 42 40
         L40 44.5
         C34 42 27 43 23 46
         Z"
      fill="url(#nbGoldBright)"
    />

    <!-- 9. Cerebellum Striations (Bottom Right) -->
    <path
      d="M43.5 42.5
         L48 41
         C46.5 45 42 47 37 47
         L38 43.5
         C40.5 43.5 42.5 43 43.5 42.5 Z"
      fill="url(#nbGoldShade)"
    />

    <!-- 10. Fluted Cocktail Coupe Pedestal Stem -->
    <path
      d="M28.5 46.5
         C29.5 49 30 52.5 27 54.5
         L35 54.5
         C32 52.5 32.5 49 33.5 46.5
         Z"
      fill="url(#nbGoldBright)"
    />
    <!-- Solid Pedestal Foot -->
    <rect x="23" y="54.5" width="16" height="2.5" rx="1" fill="url(#nbGoldHighlight)" />

    <!-- 11. Supreme Apex Star -->
    <polygon points="26,4 27.5,7 30.5,8 27.5,9 26,12 24.5,9 21.5,8 24.5,7" fill="#FFFDF0" />
    <circle cx="26" cy="8" r="0.9" fill="#FFD700" />
  </g>
</svg>